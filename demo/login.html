<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Demo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 48px auto; }
        label { display: block; margin-top: 12px; }
        input, button { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        #dashboard, #errorMessage { display: none; margin-top: 16px; padding: 12px; border-radius: 4px; }
        #dashboard { background: #e8f5e9; color: #1b5e20; }
        #errorMessage { background: #ffebee; color: #b71c1c; }
    </style>
</head>
<body>
    <h1>Login</h1>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password">

    <button id="loginBtn" type="button">Login</button>

    <div id="dashboard">Welcome to the dashboard!</div>
    <div id="errorMessage">Invalid username or password.</div>

    <script>
        document.getElementById("loginBtn").addEventListener("click", function () {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const dashboard = document.getElementById("dashboard");
            const errorMessage = document.getElementById("errorMessage");

            dashboard.style.display = "none";
            errorMessage.style.display = "none";

            if (username === "admin" && password === "password123") {
                dashboard.style.display = "block";
            } else {
                errorMessage.style.display = "block";
            }
        });
    </script>
</body>
</html>
