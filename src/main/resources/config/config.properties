# Sauce Demo
base.url=https://www.saucedemo.com
login.url=https://www.saucedemo.com/

# Browser settings
browser=chromium
headless=true

# Record a .webm for every test under test-results/videos/ (override with -Dvideo=false)
video=true

# Default timeout in milliseconds (used for waits and Playwright defaults)
timeout=30000
